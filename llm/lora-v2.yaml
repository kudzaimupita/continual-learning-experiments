model: "Qwen/Qwen3-1.7B"
train: true
fine_tune_type: lora
data: "data-v2"
batch_size: 4
iters: 200
learning_rate: 5e-5
num_layers: 16
max_seq_length: 512
mask_prompt: true
steps_per_report: 25
steps_per_eval: 100
save_every: 100
adapter_path: "adapters/v2"
grad_checkpoint: false
seed: 0
lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.0
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj", "mlp.gate_proj", "mlp.up_proj", "mlp.down_proj"]
